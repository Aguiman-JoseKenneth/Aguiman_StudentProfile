<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="initial-scale=1, width=device-width, viewport-fit=cover">
    <title>Student Profile</title>
    <link rel="stylesheet" href="css/index.css">
</head>
<body>
<header class="app-header">
    <nav class="navbar">
        <span class="logo">Student Profile</span>
        <ul class="nav-links">
            <li><a href="index.html" class="active">Profile</a></li>
            <li><a href="about.html">About</a></li>
            <li><a href="skills.html">Skills</a></li>
            <li><a href="projects.html">Projects</a></li>
            <li><a href="contact.html">Contact</a></li>
        </ul>
    </nav>
</header>

<main class="container">
    <!-- Display Profile View -->
    <section id="profile-display" class="profile-card">
        <img src="img/avatar.png" alt="Profile Picture" class="profile-avatar">
        <h1 id="display-name">Loading...</h1>
        <p class="meta"><span id="display-course">Loading...</span> - <span id="display-year">Loading...</span></p>

        <div class="profile-section">
            <h2>About Me</h2>
            <p id="display-about">Loading...</p>
        </div>

        <div class="profile-section">
            <h2>Skills</h2>
            <p id="display-skills">Loading...</p>
        </div>

        <button id="edit-profile-btn" class="btn btn-primary" type="button">Edit Profile</button>
    </section>

    <!-- Edit Profile Form (Hidden by Default) -->
    <section id="edit-profile-section" class="profile-card hidden">
        <h2>Edit Profile Information</h2>

        <div id="error-message" class="error-banner hidden"></div>

        <form id="edit-profile-form" onsubmit="return false;">
            <div class="form-group">
                <label for="input-name">Full Name *</label>
                <input type="text" id="input-name" placeholder="Enter full name">
            </div>

            <div class="form-group">
                <label for="input-course">Course *</label>
                <input type="text" id="input-course" placeholder="e.g., BS Computer Science">
            </div>

            <div class="form-group">
                <label for="input-year">Year Level *</label>
                <input type="text" id="input-year" placeholder="e.g., 3rd Year">
            </div>

            <div class="form-group">
                <label for="input-about">About Me *</label>
                <textarea id="input-about" rows="4" placeholder="Enter personal description"></textarea>
            </div>

            <div class="form-group">
                <label for="input-skills">Skills *</label>
                <textarea id="input-skills" rows="3" placeholder="Enter skills (comma-separated or listed)"></textarea>
            </div>

            <div class="button-group">
                <button id="save-btn" class="btn btn-success" type="button">Save</button>
                <button id="cancel-btn" class="btn btn-secondary" type="button">Cancel</button>
            </div>
        </form>
    </section>
</main>

<script src="cordova.js"></script>
<script src="js/index.js"></script>
</body>
</html>
