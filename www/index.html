<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="initial-scale=1, width=device-width, viewport-fit=cover">
    <link rel="stylesheet" href="css/index.css">
    <title>Student Profile</title>
</head>
<body>
<!-- Navigation Bar -->
<nav class="navbar">
    <a href="index.html" class="nav-item active">Profile</a>
    <a href="about.html" class="nav-item">About</a>
    <a href="skills.html" class="nav-item">Skills</a>
    <a href="projects.html" class="nav-item">Projects</a>
    <a href="contact.html" class="nav-item">Contact</a>
</nav>

<div class="container">
    <!-- Display Profile View -->
    <section id="profile-display" class="profile-card">
        <img src="img/avatar.png" alt="Profile Picture" class="profile-avatar">
        <h1 id="display-name">Loading...</h1>
        <p class="meta"><span id="display-course">Loading...</span> - <span id="display-year">Loading...</span></p>

        <div class="profile-section">
            <h2>About Me</h2>
            <p id="display-about">Loading...</p>
        </div>

        <div class="profile-section">
            <h2>Skills</h2>
            <p id="display-skills">Loading...</p>
        </div>

        <button id="edit-profile-btn" class="btn btn-primary">Edit Profile</button>
    </section>

    <!-- Edit Profile Form (Hidden by Default) -->
    <section id="edit-profile-section" class="profile-card hidden">
        <h2>Edit Profile Information</h2>

        <div id="error-message" class="error-banner hidden"></div>

        <form id="edit-profile-form">
            <div class="form-group">
                <label for="input-name">Full Name *</label>
                <input type="text" id="input-name" placeholder="Enter full name">
            </div>

            <div class="form-group">
                <label for="input-course">Course *</label>
                <input type="text" id="input-course" placeholder="e.g., BS Information Technology">
            </div>

            <div class="form-group">
                <label for="input-year">Year Level *</label>
                <input type="text" id="input-year" placeholder="e.g., 3rd Year">
            </div>

            <div class="form-group">
                <label for="input-about">About Me *</label>
                <textarea id="input-about" rows="4" placeholder="Brief background description"></textarea>
            </div>

            <div class="form-group">
                <label for="input-skills">Skills (comma-separated) *</label>
                <input type="text" id="input-skills" placeholder="e.g., HTML, CSS, JavaScript, Cordova">
            </div>

            <div class="button-group">
                <button type="button" id="save-btn" class="btn btn-success">Save</button>
                <button type="button" id="cancel-btn" class="btn btn-danger">Cancel</button>
            </div>
        </form>
    </section>
</div>

<script src="cordova.js"></script>
<script src="js/index.js"></script>
</body>
</html>
